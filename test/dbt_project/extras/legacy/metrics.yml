version: 2

# Pre-MetricFlow metric syntax (dbt 1.3 - 1.5).
metrics:
  - name: revenue
    label: Revenue
    model: ref('orders')
    description: Sum of order amounts.
    calculation_method: sum
    expression: amount
    timestamp: order_date
    time_grains: [day, week, month]
    dimensions: [status]
  - name: completed_orders
    label: Completed orders
    model: ref('orders')
    calculation_method: count
    expression: order_id
    timestamp: order_date
    time_grains: [day]
    filters:
      - field: status
        operator: '='
        value: "'completed'"
